x-lock-app: &lock-app
  image: ${CLASTOR_IMAGE:-clastor-distributed-lock-app:local}
  environment:
    - DISTRIBUTED_LOCK_PROVIDER=${DISTRIBUTED_LOCK_PROVIDER:-zookeeper}
    - CONNECTION_STRING=${CONNECTION_STRING:-zookeeper:2181}
    - ROOT_PATH
    - CONNECTION_TIMEOUT
    - SESSION_TIMEOUT
    - ACQUIRE_RETRY_DELAY
    - DISTRIBUTED_LOCK_ZOOKEEPER_CONNECTION_STRING
    - DISTRIBUTED_LOCK_ZOOKEEPER_ROOT_PATH
    - DISTRIBUTED_LOCK_ZOOKEEPER_CONNECTION_TIMEOUT
    - DISTRIBUTED_LOCK_ZOOKEEPER_SESSION_TIMEOUT
    - DISTRIBUTED_LOCK_ZOOKEEPER_ACQUIRE_RETRY_DELAY
    - DISTRIBUTED_LOCK_CURATOR_CONNECTION_STRING
    - DISTRIBUTED_LOCK_CURATOR_ROOT_PATH
    - DISTRIBUTED_LOCK_CURATOR_CONNECTION_TIMEOUT
    - DISTRIBUTED_LOCK_CURATOR_SESSION_TIMEOUT
  depends_on:
    zookeeper:
      condition: service_healthy

services:
  zookeeper:
    image: zookeeper:3.9.4@sha256:dfa9ba46d14bd52bcb3c1dac3ba91f179cf4cebf7ee576e1c2df09c68fc1d30d
    environment:
      ZOO_ADMINSERVER_ENABLED: "false"
    healthcheck:
      test: ["CMD", "zkServer.sh", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - zk-data:/data
      - zk-log:/datalog

  distributed-lock-app-1:
    <<: *lock-app
    build:
      context: ..
      dockerfile: app/Dockerfile
    ports:
      - "127.0.0.1:8079:8080"

  distributed-lock-app-2:
    <<: *lock-app
    pull_policy: never
    profiles: [cluster]
    ports:
      - "127.0.0.1:8078:8080"

volumes:
  zk-data:
  zk-log:
